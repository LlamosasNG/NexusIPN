services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus_ipn}
      POSTGRES_USER: ${POSTGRES_USER:-nexus_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nexus

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus_ipn}
      DATABASE_SSL: "false"
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nexus

  nginx:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      - api
    ports:
      - "${NGINX_PORT:-80}:80"
    restart: unless-stopped
    networks:
      - nexus

networks:
  nexus:
    driver: bridge

volumes:
  postgres_data:
